name: CodeQL

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Detect code scanning availability
        id: code_scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err_file="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" >/dev/null 2>"$err_file"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "code scanning availability: enabled" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Cannot verify code-scanning access; refusing to skip analysis" >> "$GITHUB_STEP_SUMMARY"
          cat "$err_file" >&2
          exit 1

      - name: Checkout repository
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: ${{ matrix.language }}

      - name: Set up Python
        if: steps.code_scanning.outputs.enabled == 'true' && matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Set up uv
        if: steps.code_scanning.outputs.enabled == 'true' && matrix.language == 'python'
        uses: astral-sh/setup-uv@0ca8f610542aa7f4acaf39e65cf4eb3c35091883
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.code_scanning.outputs.enabled == 'true' && matrix.language == 'python'
        run: uv sync --frozen --extra dev

      - name: Perform CodeQL Analysis
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: "/language:${{ matrix.language }}"
